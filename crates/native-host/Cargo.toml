[package]
name = "native-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Download Automations Chrome native messaging host"
license = "MIT"

[lib]
name = "native_host"
path = "src/lib.rs"

[[bin]]
name = "native-host"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
native_messaging = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
system_shutdown = "4.1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
